<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Estética Zen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #fce4ec 0%, #fff9fb 100%); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', sans-serif; 
        }
        .card-login { 
            width: 380px; 
            border: none; 
            border-radius: 30px; 
            padding: 30px; 
            background: white; 
        }
        .btn-login { 
            background-color: #f06292; 
            color: white; 
            border-radius: 25px; 
            font-weight: 600; 
            transition: 0.3s; 
        }
        .btn-login:hover { 
            background-color: #ec407a; 
            color: white; 
            transform: scale(1.02); 
        }
        .form-control { border-color: #f8bbd0; }
        .form-control:focus {
            border-color: #f06292;
            box-shadow: 0 0 0 0.25rem rgba(240, 98, 146, 0.25);
        }
        .modal-content { border-radius: 25px; border: none; }
        .modal-header { background-color: #fce4ec; border-bottom: 2px solid #f8bbd0; border-top-left-radius: 25px; border-top-right-radius: 25px; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-rosa { animation: slideIn 0.3s ease forwards; }
    </style>
</head>
<body>

    <div class="card card-login shadow-lg text-center">
        <div class="card-body">
            <h3 class="mb-2" style="color: #f06292; font-weight: bold;">🌸 Estética Zen</h3>
            <p class="text-muted small mb-4">Ingresa para gestionar tus turnos</p>

            <div class="mb-3 text-start">
                <label class="form-label small fw-bold">Email</label>
                <input type="text" id="email" class="form-control rounded-pill" placeholder="ejemplo@correo.com" autocomplete="off">
            </div>
            <div class="mb-4 text-start">
                <label class="form-label small fw-bold">Contraseña</label>
                <input type="text" id="password" class="form-control rounded-pill" placeholder="••••••••" autocomplete="new-password" onfocus="this.type='password';">
            </div>
            
            <button class="btn btn-login w-100 py-2 mb-3 shadow-sm" onclick="verificarLoginReal()">INGRESAR</button>
            <p class="small text-muted mb-3">¿No tienes cuenta? <a href="#" data-bs-toggle="modal" data-bs-target="#modalRegistro" style="color: #f06292; font-weight: 600; text-decoration: none;">Regístrate aquí</a></p>
            <a href="index.html" class="small text-muted text-decoration-none">← Volver a la Landing</a>
        </div>
    </div>

    <div class="modal fade" id="modalRegistro" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg">
                <div class="modal-header">
                    <h5 class="modal-title" style="color: #f06292; font-weight: bold;">👤 Crear Cuenta de Cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 text-start">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Nombre y Apellido</label>
                        <input type="text" id="reg-nombre" class="form-control rounded-pill" placeholder="Ej: Ana Clara Pérez">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email</label>
                        <input type="email" id="reg-email" class="form-control rounded-pill" placeholder="ejemplo@correo.com">
                    </div>
                    <button class="btn btn-login w-100 py-2 rounded-pill shadow-sm" onclick="procesarRegistroReal()">CREAR CUENTA E INGRESAR</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const inputEmail = document.getElementById('email');
                const inputPass = document.getElementById('password');
                if (inputEmail) inputEmail.value = '';
                if (inputPass) { inputPass.value = ''; inputPass.type = 'text'; }
            }, 50);
        });

        function lanzarToast(mensaje) {
            const aviso = document.createElement('div');
            aviso.className = 'toast-rosa';
            aviso.style.position = 'fixed';
            aviso.style.bottom = '20px';
            aviso.style.right = '20px';
            aviso.style.backgroundColor = '#f06292';
            aviso.style.color = 'white';
            aviso.style.padding = '15px 25px';
            aviso.style.borderRadius = '15px';
            aviso.style.zIndex = '9999';
            aviso.innerText = mensaje;
            document.body.appendChild(aviso);
        }

        async function verificarLoginReal() {
            const emailIn = document.getElementById('email').value.trim();
            if(!emailIn) { alert("Ingresa un correo electrónico."); return; }

            // Credencial Maestra Exclusiva del Administrador
            if(emailIn === 'admin@zen.com') {
                localStorage.setItem('emailUsuarioLogueado', emailIn);
                lanzarToast("🔓 Acceso Concedido como Administrador.");
                setTimeout(() => { window.location.href = 'admin.html'; }, 1000);
                return;
            }

            try {
                const res = await fetch(`${window.location.origin}/api/usuarios`);
                const usuarios = await res.json();
                const usuarioEncontrado = usuarios.find(u => u.email.toLowerCase() === emailIn.toLowerCase());

                if(!usuarioEncontrado) {
                    alert("❌ El correo ingresado no se encuentra registrado en Neon Cloud.");
                    return;
                }

                localStorage.setItem('emailUsuarioLogueado', usuarioEncontrado.email);

                if(usuarioEncontrado.rol === 'pro') {
                    lanzarToast(`🔓 Agenda Profesional: Hola ${usuarioEncontrado.nombre}`);
                    setTimeout(() => { window.location.href = 'profesional.html'; }, 1000);
                } else {
                    lanzarToast(`🔓 Bienvenido, ${usuarioEncontrado.nombre}`);
                    setTimeout(() => { window.location.href = 'reserva.html'; }, 1000);
                }
            } catch (err) { alert("Error al conectar con Postgres."); }
        }

        async function procesarRegistroReal() {
            const nombre = document.getElementById('reg-nombre').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            if(!nombre || !email) { alert("Completa los campos."); return; }

            try {
                const respuesta = await fetch(`${window.location.origin}/api/usuarios`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: nombre, email: email, rol: 'cliente' })
                });

                if(respuesta.ok) {
                    localStorage.setItem('emailUsuarioLogueado', email);
                    lanzarToast("🎉 Registro exitoso guardado en Neon.");
                    setTimeout(() => { window.location.href = 'reserva.html'; }, 1200);
                } else { alert("Error: El correo ya existe o es inválido."); }
            } catch (err) { alert("Error de red."); }
        }
    </script>
</body>
</html>
