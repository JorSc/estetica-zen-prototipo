<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Estética Zen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #fce4ec 0%, #fff9fb 100%); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', sans-serif; 
        }
        .card-login { 
            width: 380px; 
            border: none; 
            border-radius: 30px; 
            padding: 30px; 
            background: white; 
        }
        .btn-login { 
            background-color: #f06292; 
            color: white; 
            border-radius: 25px; 
            font-weight: 600; 
            transition: 0.3s; 
        }
        .btn-login:hover { 
            background-color: #ec407a; 
            color: white; 
            transform: scale(1.02); 
        }
        .form-control { border-color: #f8bbd0; }
        .form-control:focus {
            border-color: #f06292;
            box-shadow: 0 0 0 0.25rem rgba(240, 98, 146, 0.25);
        }
        .modal-content { border-radius: 25px; border: none; }
        .modal-header { background-color: #fce4ec; border-bottom: 2px solid #f8bbd0; border-top-left-radius: 25px; border-top-right-radius: 25px; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-rosa { animation: slideIn 0.3s ease forwards; }
    </style>
</head>
<body>

    <div class="card card-login shadow-lg text-center">
        <div class="card-body">
            <h3 class="mb-2" style="color: #f06292; font-weight: bold;">🌸 Estética Zen</h3>
            <p class="text-muted small mb-4">Ingresa para gestionar tus turnos</p>

            <div class="mb-3 text-start">
                <label class="form-label small fw-bold">Email</label>
                <input type="text" id="email" class="form-control rounded-pill" placeholder="ejemplo@correo.com" autocomplete="off">
            </div>
            <div class="mb-4 text-start">
                <label class="form-label small fw-bold">Contraseña</label>
                <input type="password" id="password" class="form-control rounded-pill" placeholder="••••••••" autocomplete="current-password">
            </div>
            
            <button class="btn btn-login w-100 py-2 mb-3 shadow-sm" onclick="verificarLoginReal()">INGRESAR</button>
            <p class="small text-muted mb-3">
                ¿No tienes cuenta? 
                <a href="javascript:void(0);" onclick="abrirModalRegistroManual()" style="color: #f06292; font-weight: 600; text-decoration: none;">Regístrate aquí</a>
            </p>
            <a href="index.html" class="small text-muted text-decoration-none">← Volver a la Landing</a>
        </div>
    </div>

    <!-- MODAL DE REGISTRO CON CONTRASEÑA REAL -->
    <div class="modal fade" id="modalRegistro" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg">
                <div class="modal-header">
                    <h5 class="modal-title" style="color: #f06292; font-weight: bold;">👤 Crear Cuenta de Cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 text-start">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Nombre y Apellido</label>
                        <input type="text" id="reg-nombre" class="form-control rounded-pill" placeholder="Ej: Ana Clara Pérez">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email de Contacto</label>
                        <input type="email" id="reg-email" class="form-control rounded-pill" placeholder="ejemplo@correo.com">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Crea tu Contraseña de Acceso</label>
                        <input type="password" id="reg-password" class="form-control rounded-pill" placeholder="Mínimo 4 caracteres">
                    </div>
                    <button class="btn btn-login w-100 py-2 rounded-pill shadow-sm" onclick="procesarRegistroReal()">CREAR CUENTA E INGRESAR</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Limpieza básica de inputs al cargar
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        });

        function lanzarToast(mensaje) {
            const aviso = document.createElement('div');
            aviso.className = 'toast-rosa';
            aviso.style.position = 'fixed';
            aviso.style.bottom = '20px';
            aviso.style.right = '20px';
            aviso.style.backgroundColor = '#f06292';
            aviso.style.color = 'white';
            aviso.style.padding = '15px 25px';
            aviso.style.borderRadius = '15px';
            aviso.style.zIndex = '9999';
            aviso.innerText = mensaje;
            document.body.appendChild(aviso);
            setTimeout(() => { aviso.remove(); }, 3000);
        }

        function abrirModalRegistroManual() {
            const miModalEl = document.getElementById('modalRegistro');
            const instanciaModal = new bootstrap.Modal(miModalEl);
            instanciaModal.show();
        }

        // 🛡️ LOGIN: DETERMINA LA REDIRECCIÓN LEYENDO EL ROL DE NEON
        async function verificarLoginReal() {
            const emailIn = document.getElementById('email').value.trim();
            const passwordIn = document.getElementById('password').value.trim();

            if(!emailIn || !passwordIn) { 
                alert("Por favor, completa tu email y contraseña."); 
                return; 
            }

            try {
                const res = await fetch(`${window.location.origin}/api/usuarios`);
                const usuarios = await res.json();
                
                // Buscamos coincidencia exacta de email Y contraseña en tu Postgres
                const usuarioEncontrado = usuarios.find(u => 
                    u.email.toLowerCase() === emailIn.toLowerCase() && 
                    String(u.password).trim() === passwordIn
                );

                if(!usuarioEncontrado) {
                    alert("❌ Credenciales incorrectas. Verifica tu email o contraseña.");
                    return;
                }

                // Guardamos el email del usuario logueado en sesión
                localStorage.setItem('emailUsuarioLogueado', usuarioEncontrado.email);

                // 🚀 REDIRECCIÓN EXACTA BASADA EN EL ROL DE LA BASE DE DATOS
                if (usuarioEncontrado.rol === 'admin') {
                    lanzarToast("🔓 Acceso Concedido como Administrador.");
                    setTimeout(() => { window.location.href = 'admin.html'; }, 1000);
                } else if (usuarioEncontrado.rol === 'pro') {
                    lanzarToast(`🔓 Agenda Profesional: Hola ${usuarioEncontrado.nombre}`);
                    setTimeout(() => { window.location.href = 'profesional.html'; }, 1000);
                } else {
                    lanzarToast(`🔓 Bienvenido, ${usuarioEncontrado.nombre}`);
                    setTimeout(() => { window.location.href = 'reserva.html'; }, 1000);
                }
            } catch (err) { alert("Error al conectar con la base de datos cloud."); }
        }

        // 🛡️ REGISTRO COMPLETO DE CLIENTES NUEVOS
        async function procesarRegistroReal() {
            const nombre = document.getElementById('reg-nombre').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();

            if(!nombre || !email || !password) { 
                alert("Por favor complete todos los campos, incluyendo la contraseña."); 
                return; 
            }

            try {
                const respuesta = await fetch(`${window.location.origin}/api/usuarios`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        nombre: nombre, 
                        email: email, 
                        password: password, 
                        rol: 'cliente' 
                    })
                });

                if(respuesta.ok) {
                    localStorage.setItem('emailUsuarioLogueado', email);
                    
                    const modalEl = document.getElementById('modalRegistro');
                    const instanciaModal = bootstrap.Modal.getInstance(modalEl);
                    if(instanciaModal) instanciaModal.hide();

                    lanzarToast("🎉 Cuenta creada y protegida con éxito en Postgres.");
                    setTimeout(() => { window.location.href = 'reserva.html'; }, 1200);
                } else { 
                    alert("Error: El correo electrónico ya se encuentra registrado."); 
                }
            } catch (err) { alert("Error de red con el servidor."); }
        }
    </script>
</body>
</html>
