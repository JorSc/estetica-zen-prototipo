<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Profesional - Estética Zen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { 
            --rosa-p: #fce4ec; 
            --rosa-f: #f06292; 
            --rosa-h: #f8bbd0; 
            --texto-oscuro: #4f4f4f;
        }
        body { 
            background-color: #fff9fb; 
            color: var(--texto-oscuro); 
            font-family: 'Segoe UI', sans-serif; 
        }
        .navbar { 
            background-color: white; 
            border-bottom: 2px solid var(--rosa-p); 
        }
        .card-turno { 
            border-left: 6px solid var(--rosa-f); 
            border-radius: 20px; 
            transition: 0.3s; 
        }
        .btn-check-estado { 
            border-radius: 20px; 
            font-size: 0.8rem; 
            font-weight: 600;
        }
        .badge-hora {
            background-color: var(--rosa-p);
            color: var(--rosa-f);
            font-weight: bold;
            border-radius: 10px;
            padding: 6px 12px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-light px-4 py-3 shadow-sm mb-5">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div>
                <a href="index.html" class="text-decoration-none small me-3" style="color: var(--rosa-f)">← Volver al Inicio</a>
                <span class="navbar-brand h1 mb-0" style="color: var(--rosa-f);">🌸 ESTÉTICA ZEN</span>
            </div>
            <div>
                <span class="text-muted small me-3 fw-bold">👩‍⚕️ Dra. Ana Valenzuela (Cosmiatra)</span>
                <a href="login.html" class="btn btn-sm btn-outline-secondary rounded-pill px-3">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 800px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1">Mis Citas Agendadas</h4>
                <p class="text-muted small mb-0">Gestión y control de asistencia sincronizado en tiempo real con Neon SQL</p>
            </div>
        </div>
        
        <div id="contenedor-citas-profesional">
            <div class="text-muted text-center small py-4">Conectando con la base de datos central...</div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // AL CARGAR LA PÁGINA: Traer catálogo y filtrar turnos reales para el Profesional ID: 1
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                // 1. Necesitamos los nombres de los servicios primero para mapear el ID del turno
                const resServicios = await fetch(`${window.location.origin}/api/servicios`);
                const servicios = await resServicios.json();

                // 2. Traer la bitácora maestra de turnos
                const resTurnos = await fetch(`${window.location.origin}/api/turnos/maestro`);
                const turnos = await resTurnos.json();

                // 3. Filtrar para mostrar únicamente las citas de la Dra. Ana Valenzuela (ID: 1)
                const turnosPro = turnos.filter(t => t.profesional_id === 1);
                
                const contenedor = document.getElementById('contenedor-citas-profesional');
                contenedor.innerHTML = '';

                if(turnosPro.length === 0) {
                    contenedor.innerHTML = `<div class="text-muted text-center py-4 card shadow-sm border-0 rounded-4">No registras citas asignadas en la base de datos central para hoy.</div>`;
                    return;
                }

                // 4. Renderizar las tarjetas con tu diseño original de Bootstrap
                turnosPro.forEach(t => {
                    const servicioEncontrado = servicios.find(s => s.id === t.servicio_id);
                    const nombreServicio = servicioEncontrado ? servicioEncontrado.nombre : `Servicio N° ${t.servicio_id}`;
                    const duracionServicio = servicioEncontrado ? `${servicioEncontrado.duracion} min` : '60 min';
                    
                    // Separamos fecha y hora para la visualización del Badge
                    const [fecha, hora] = t.fecha_hora.split(' ');

                    contenedor.innerHTML += `
                        <div class="card shadow-sm border-0 mb-3 card-turno" id="turno-${t.id}">
                            <div class="card-body d-flex justify-content-between align-items-center p-4">
                                <div>
                                    <span class="badge badge-hora mb-2 d-inline-block">${hora || t.fecha_hora} AM</span>
                                    <h5 class="mb-1 fw-bold" style="color: #333;">Paciente ID: ${t.cliente_id}</h5>
                                    <p class="text-muted small mb-2">✨ ${nombreServicio} (${duracionServicio})</p>
                                    <span class="small text-muted d-block mb-2">📅 Fecha: ${fecha}</span>
                                    <span class="small fw-bold text-warning estado-texto">Estado: Pendiente</span>
                                </div>
                                <div class="d-flex gap-2 acciones-contenedor">
                                    <button class="btn btn-outline-success btn-check-estado px-3" onclick="cambiarEstadoTurno(${t.id}, 'Completado')">✓ Completado</button>
                                    <button class="btn btn-outline-danger btn-check-estado px-3" onclick="cambiarEstadoTurno(${t.id}, 'Ausente')">✗ Ausente</button>
                                </div>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                console.error("Error al sincronizar la agenda del profesional:", error);
                document.getElementById('contenedor-citas-profesional').innerHTML = `<div class="text-danger text-center small py-3">Error crítico de comunicación con el motor del servidor.</div>`;
            }
        });

        // Tu lógica original interactiva intacta para simular el cambio de estado en pantalla
        function cambiarEstadoTurno(id, nuevoEstado) {
            const tarjeta = document.getElementById(`turno-${id}`);
            const textoEstado = tarjeta.querySelector('.estado-texto');
            const contenedorAcciones = tarjeta.querySelector('.acciones-contenedor');

            if (nuevoEstado === 'Completado') {
                tarjeta.style.borderLeftColor = "#198754"; 
                tarjeta.style.backgroundColor = "#e8f5e9"; 
                textoEstado.innerText = "Estado: ✓ Atendido con éxito";
                textoEstado.className = "small fw-bold text-success";
            } else {
                tarjeta.style.borderLeftColor = "#dc3545"; 
                tarjeta.style.backgroundColor = "#ffebee"; 
                textoEstado.innerText = "Estado: ✗ Paciente Ausente";
                textoEstado.className = "small fw-bold text-danger";
            }

            contenedorAcciones.innerHTML = `<span class="badge bg-secondary rounded-pill px-3 py-2 small" style="font-size:0.75rem;">Asistencia Registrada</span>`;
        }
    </script>
</body>
</html>
