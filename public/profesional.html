<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Profesional - Estética Zen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --rosa-f: #f06292; --rosa-p: #fce4ec; --texto-oscuro: #4f4f4f; }
        body { background-color: #fff9fb; font-family: 'Segoe UI', sans-serif; color: var(--texto-oscuro); }
        .card-agenda { border-radius: 20px; border: none; background: white; }
        .badge-estado { font-weight: 600; border-radius: 10px; padding: 6px 12px; }
        .btn-exportar-pro { background-color: #4f4f4f; color: white; border-radius: 25px; border: none; font-weight: 600; transition: 0.3s; }
        .btn-exportar-pro:hover { background-color: #333; color: white; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="container mt-5" style="max-width: 900px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold" style="color: var(--rosa-f);" id="txt-saludo-profesional">🌸 Agenda del Especialista</h3>
                <p class="text-muted small mb-0" id="txt-email-profesional">Cargando perfil...</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-exportar-pro px-3 shadow-sm" onclick="exportarAgendaProfesionalReal()">📥 Exportar Mi Agenda (Excel)</button>
                <button class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="cerrarSesionPro()">Cerrar Sesión</button>
            </div>
        </div>

        <div class="card card-custom card-agenda shadow-sm p-4">
            <h5 class="fw-bold mb-3">📋 Cronograma de Citas Asignadas (Ecosistema Real)</h5>
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr><th>Bloque / Fecha</th><th>Paciente</th><th>Tratamiento Solicitado</th><th class="text-center">Control de Cabina</th></tr>
                </thead>
                <tbody id="tabla-agenda-profesional"></tbody>
            </table>
        </div>
    </div>

    <script>
        let miIdProfesional = null;
        let miNombreProfesional = "";
        let serviciosCache = [];
        let turnosProfesionalCacheGlobal = [];

        document.addEventListener("DOMContentLoaded", async () => {
            const emailLogueado = localStorage.getItem('emailUsuarioLogueado');
            if(!emailLogueado) { window.location.href = 'login.html'; return; }

            try {
                const resServ = await fetch(`${window.location.origin}/api/servicios`);
                serviciosCache = await resServ.json();

                const resUser = await fetch(`${window.location.origin}/api/usuarios`);
                const usuarios = await resUser.json();
                const miPerfil = usuarios.find(u => u.email.toLowerCase() === emailLogueado.toLowerCase());

                if(miPerfil) {
                    miIdProfesional = miPerfil.id;
                    miNombreProfesional = miPerfil.nombre;
                    document.getElementById('txt-saludo-profesional').innerText = `🌸 Agenda: ${miPerfil.nombre}`;
                    document.getElementById('txt-email-profesional').innerText = `Conectado como Especialista ID Técnico: #${miPerfil.id} | ${miPerfil.email}`;
                    await cargarCitasDelEspecialista();
                }
            } catch (err) { console.error(err); }
        });

        async function cargarCitasDelEspecialista() {
            const tbody = document.getElementById('tabla-agenda-profesional');
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted small">Consultando agenda...</td></tr>';

            const resTurn = await fetch(`${window.location.origin}/api/turnos/detallado`);
            const todosLosTurnos = await resTurn.json();

            turnosProfesionalCacheGlobal = todosLosTurnos.filter(t => Number(t.profesional_id) === Number(miIdProfesional));
            tbody.innerHTML = '';

            if(turnosProfesionalCacheGlobal.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted small py-4">No registras citas asignadas en Neon Cloud para tu ID técnico.</td></tr>';
                return;
            }

            turnosProfesionalCacheGlobal.forEach(t => {
                // Parseo del estado en caliente guardado en Postgres
                let celdaAccionHtml = "";
                let fechaLimpiaYHora = t.fecha_hora;

                if(t.fecha_hora.includes("//atendido")) {
                    fechaLimpiaYHora = t.fecha_hora.replace("//atendido", "");
                    celdaAccionHtml = `<span class="badge bg-success badge-estado">✨ Atendido con Éxito</span>`;
                } else if(t.fecha_hora.includes("//ausente")) {
                    fechaLimpiaYHora = t.fecha_hora.replace("//ausente", "");
                    celdaAccionHtml = `<span class="badge bg-danger badge-estado">❌ Paciente Ausente</span>`;
                } else {
                    celdaAccionHtml = `
                        <button class="btn btn-sm btn-success rounded-pill px-3 me-1" onclick="cambiarEstadoCitaReal(${t.id}, '${t.fecha_hora}', 'atendido')">✓ Atendido</button>
                        <button class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="cambiarEstadoCitaReal(${t.id}, '${t.fecha_hora}', 'ausente')">✗ Ausente</button>
                    `;
                }

                tbody.innerHTML += `
                    <tr id="fila-pro-turno-${t.id}">
                        <td><span class="badge bg-light text-dark fw-bold">${fechaLimpiaYHora} hs</span></td>
                        <td><b>${t.cliente_nombre || 'Usuario'}</b> <br><small class="text-muted">ID: #${t.cliente_id}</small></td>
                        <td><b>${t.servicio_nombre || 'Tratamiento'}</b></td>
                        <td class="text-center" id="celda-accion-${t.id}">${celdaAccionHtml}</td>
                    </tr>`;
            });
        }

        // 🔥 IMPACTA EL ESTADO REAL EN POSTGRES
        async function cambiarEstadoCitaReal(idTurno, fechaHoraOriginal, estadoNuevo) {
            const nuevaDataString = `${fechaHoraOriginal}//${estadoNuevo}`;
            
            const res = await fetch(`${window.location.origin}/api/turnos/${idTurno}/reprogramar`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fecha_hora: nuevaDataString, profesional_id: miIdProfesional })
            });

            if(res.ok) {
                await cargarCitasDelEspecialista();
            } else {
                alert("Error al procesar el estado en cabina.");
            }
        }

        function exportarAgendaProfesionalReal() {
            if(turnosProfesionalCacheGlobal.length === 0) { alert("No tienes citas."); return; }
            let contenidoCSV = "ID_Cita,Fecha_Y_Hora,Paciente_Nombre,Tratamiento_Solicitado,Estado_Auditoria\n";
            turnosProfesionalCacheGlobal.forEach(t => {
                let est = "Pendiente";
                let fh = t.fecha_hora;
                if(t.fecha_hora.includes("//atendido")) { est = "Atendido"; fh = t.fecha_hora.replace("//atendido",""); }
                if(t.fecha_hora.includes("//ausente")) { est = "Ausente"; fh = t.fecha_hora.replace("//ausente",""); }
                contenidoCSV += `${t.id},"\t${fh}","${t.cliente_nombre}","${t.servicio_nombre}","${est}"\n`;
            });
            const blob = new Blob(["\uFEFF" + contenidoCSV], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", `Mi_Agenda_${miNombreProfesional.replace(/\s+/g, '_')}.csv`);
            link.click();
        }

        function cerrarSesionPro() { localStorage.removeItem('emailUsuarioLogueado'); window.location.href = 'login.html'; }
    </script>
</body>
</html>
